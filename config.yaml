# OpenMontage - Global Configuration

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: null                    # null = use provider default
  temperature: 0.7
  max_tokens: 4096

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

# Generation is local/agent-native by default. Explicit per-call provider choices
# still win over these preferences.
generation:
  image:
    preferred_provider: codex
  video:
    preferred_provider: comfyui
    preferred_operation: image_to_video
    image_to_video_workflow: OpenMontage_WAN3_fl2va
    reference_to_video_workflow: OpenMontage_WAN3_ref2va
    text_to_video_workflow: OpenMontage_MiniMaxH3_fl2va

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
